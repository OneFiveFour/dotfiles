# Hyprpaper 0.8.5: dunkles GNOME-Bild auf beiden Monitoren.
# Kein zusaetzlicher Text auf dem Hintergrundbild.
splash = false

# Linker Monitor im Portraitformat.
wallpaper {
    monitor = DP-3
    path = /usr/share/backgrounds/gnome/progress-d.jxl
    fit_mode = cover
}

# Rechter Monitor im Landscapeformat.
wallpaper {
    monitor = DP-4
    path = /usr/share/backgrounds/gnome/progress-d.jxl
    fit_mode = cover
}
