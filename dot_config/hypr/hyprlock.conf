# Hyprlock 0.9.7: ausschliesslich manuelles Sperren.
# Leeres monitor-Feld gilt fuer alle Monitore.
$font = Noto Sans

general {
    hide_cursor = true
}

# Keine Einblendung, bei der der Desktop durchscheinen koennte.
animations {
    enabled = false
}

background {
    monitor =
    path = /usr/share/backgrounds/gnome/progress-d.jxl
    blur_passes = 2
}

input-field {
    monitor =
    size = 340, 56
    outline_thickness = 2
    inner_color = rgba(20242cee)
    outer_color = rgba(91b9efff)
    check_color = rgba(91b9efff)
    fail_color = rgba(efad91ff)
    font_color = rgb(e6e9ef)
    font_family = $font
    fade_on_empty = false
    rounding = 10
    placeholder_text = Passwort eingeben
    fail_text = Entsperren fehlgeschlagen
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb(e6e9ef)
    font_size = 64
    font_family = $font
    position = 0, 100
    halign = center
    valign = center
}
