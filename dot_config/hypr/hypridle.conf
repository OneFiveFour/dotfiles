# Hypridle 0.1.8: Zeitangaben in Sekunden seit der letzten Eingabe.
general {
    # Nur einen Sperrbildschirm starten, ohne Schonfrist oder Einblendung.
    lock_cmd = pgrep -x hyprlock > /dev/null || hyprlock --grace 0 --no-fade-in

    # Die aktuelle grafische Sitzung vor anderweitig ausgeloestem Schlaf sperren.
    before_sleep_cmd = loginctl lock-session "$XDG_SESSION_ID"
    # Vor dem Einschlafen warten, bis die Sitzung wirklich gesperrt ist.
    inhibit_sleep = 3
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# 300 Sekunden = 5 Minuten: Sitzung sperren.
listener {
    timeout = 300
    on-timeout = loginctl lock-session "$XDG_SESSION_ID"
}

# 600 Sekunden = insgesamt 10 Minuten: beide Monitore ausschalten.
listener {
    timeout = 600
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    # Eingabe schaltet nur die Monitore ein, entsperrt aber nicht die Sitzung.
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}
